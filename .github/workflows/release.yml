name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag, the plugin version, and the ZIP must agree.
      - name: Check the plugin version
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not agree with the plugin version $version."
            exit 1
          fi

      # The ZIP holds the betabud-gym-api folder, with SKILL.md at the top of that folder.
      - name: Make the ZIP
        run: cd skills && zip -r ../betabud-gym-api.zip betabud-gym-api

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" betabud-gym-api.zip --title "$GITHUB_REF_NAME" --generate-notes
